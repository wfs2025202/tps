<!DOCTYPE html>
<html>
<head>
<title>Arrow Example</title>
<style>
  #fromDiv {
    width: 100px;
    height: 50px;
    background-color: blue;
    position: absolute;
    left: 50px;
    top: 50px;
  }

  #toDiv {
    width: 100px;
    height: 50px;
    background-color: blue;
    position: absolute;
    left: 250px;
    top: 150px;
  }
</style>
</head>
<body>

  <div id="fromDiv"></div>
  <div id="toDiv"></div>

  <script>
    function drawArrow(fromElement, toElement) {
      const fromRect = fromElement.getBoundingClientRect();
      const toRect = toElement.getBoundingClientRect();

      // Calculate arrow coordinates
      const arrowLength = 20; // Adjust arrow length as needed
      const arrowWidth = 10; // Adjust arrow width as needed
      const x1 = fromRect.right;
      const y1 = fromRect.top + fromRect.height / 2;
      const x2 = toRect.left;
      const y2 = toRect.top + toRect.height / 2;

      // Calculate angle of the arrow
      const angle = Math.atan2(y2 - y1, x2 - x1);

      // Calculate arrowhead coordinates
      const arrowheadX1 = x2 - arrowLength * Math.cos(angle);
      const arrowheadY1 = y2 - arrowLength * Math.sin(angle);
      const arrowheadX2 = arrowheadX1 - arrowWidth * Math.cos(angle - Math.PI / 6);
      const arrowheadY2 = arrowheadY1 - arrowWidth * Math.sin(angle - Math.PI / 6);
      const arrowheadX3 = arrowheadX1 - arrowWidth * Math.cos(angle + Math.PI / 6);
      const arrowheadY3 = arrowheadY1 - arrowWidth * Math.sin(angle + Math.PI / 6);

      // Create SVG element
      const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      svg.setAttribute("width", window.innerWidth);
      svg.setAttribute("height", window.innerHeight);
      svg.style.position = "absolute";
      svg.style.pointerEvents = "none"; // Prevent arrow from blocking clicks

      // Create path for the arrow
      const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
      path.setAttribute("d", `M ${x1},${y1} L ${x2},${y2} M ${x2},${y2} L ${arrowheadX2},${arrowheadY2} M ${x2},${y2} L ${arrowheadX3},${arrowheadY3}`);
      path.setAttribute("stroke", "blue");
      path.setAttribute("stroke-width", 2);
      path.setAttribute("fill", "none");

      // Add path to SVG
      svg.appendChild(path);

      // Add SVG to the document
      document.body.appendChild(svg);
    }

    const fromDiv = document.getElementById("fromDiv");
    const toDiv = document.getElementById("toDiv");

    drawArrow(fromDiv, toDiv);
  </script>

</body>
</html>
